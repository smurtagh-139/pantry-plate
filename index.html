<html lang="en"><head>

<style>
/* Layout: phone-first single column; sticky top bar, tab bar fixed to the bottom like an Android app */
:root{
  --bg:#f5f7f2; --surface:#ffffff; --ink:#1d2a22; --muted:#5d6b62; --line:#dde4dc;
  --accent:#2f6b4f; --accent-ink:#ffffff; --accent-soft:#e3efe7;
  --tomato:#c2412d; --butter:#a76f00; --ok:#2a7a3e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --ink:#e6eee8; --muted:#97a69c; --line:#2a362f;
  --accent:#7cc39b; --accent-ink:#0d1a13; --accent-soft:#1f3328;
  --tomato:#ff8a73; --butter:#e5b450; --ok:#79d08f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --ink:#e6eee8; --muted:#97a69c; --line:#2a362f;
  --accent:#7cc39b; --accent-ink:#0d1a13; --accent-soft:#1f3328;
  --tomato:#ff8a73; --butter:#e5b450; --ok:#79d08f; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
:root{padding-top:env(safe-area-inset-top,0px)}
body{font:15px/1.5 var(--body);min-height:100%;margin:0}
[hidden]{display:none!important}
#signin{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#signin .box{max-width:360px;text-align:center;display:flex;flex-direction:column;gap:14px}
#signin h1{font-size:2rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1{font:750 1.45rem/1.1 var(--display);margin:0;letter-spacing:-.01em}
h2{font:600 1.15rem/1.2 var(--display);margin:0;text-wrap:balance}
.sync{font-size:.78rem;color:var(--muted)}
.sync.warn{color:var(--butter)}
section{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
button,.btn{font:600 .92rem var(--body);border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;min-height:40px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--tomato);border-color:var(--tomato);background:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;box-sizing:border-box}
textarea{min-height:90px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.num{font-variant-numeric:tabular-nums}

/* budget meter */
.meter{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.over>i{background:var(--tomato)}

/* week */
.day{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.dname{font:750 1.05rem/1 var(--display);padding-top:4px}
.dname small{display:block;font:500 .7rem var(--body);color:var(--muted);margin-top:3px;letter-spacing:.04em;text-transform:uppercase}
.meal{font-weight:600;font-size:1.02rem}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 .74rem var(--body);letter-spacing:.03em;text-transform:uppercase;border-radius:99px;padding:3px 9px;border:1px solid var(--line);color:var(--muted);background:transparent;min-height:0;cursor:pointer}
.chip.cook{color:var(--accent);border-color:var(--accent)}
.chip.quick{color:var(--butter);border-color:var(--butter)}
.chip.leftovers{color:var(--muted)}
.chip.skip{color:var(--muted);border-style:dashed}
.tag{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.tag.cost{color:var(--tomato);border-color:transparent;padding-left:0}
.tag.free{color:var(--ok);border-color:transparent;padding-left:0}
.how{font-size:.88rem;color:var(--muted);margin:6px 0 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{min-height:34px;padding:5px 11px;font-size:.82rem}
.done{color:var(--ok);font-weight:600;font-size:.85rem}
.pin{color:var(--accent)}

/* lists */
.list{display:flex;flex-direction:column;gap:0}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{min-height:34px;width:34px;padding:0;font-size:1.1rem}
.step .q{min-width:2.4em;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.price{width:76px}
.shop label{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:.95rem;font-weight:400}
.shop input{width:20px;min-height:20px;accent-color:var(--accent)}
.shop .got{color:var(--muted);text-decoration:line-through}

.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.warnbox{font-size:.88rem;color:var(--ink);border:1px solid var(--butter);border-radius:10px;padding:8px 12px}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:640px}
nav.tabs button{border:0;border-radius:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;min-height:56px;font-size:.72rem;font-weight:600}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s,color .15s}}
</style>

<script type="module">
/* Firebase: Google sign-in + Firestore, wrapped to look like the small db API the app uses */
import {firebaseConfig,AI_URL} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,collection,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const gate=document.getElementById("signin"),msg=document.getElementById("signinMsg"),btn=document.getElementById("googleBtn");
window.ppAiUrl=AI_URL||"";
if(!firebaseConfig||!firebaseConfig.apiKey||/PASTE/.test(firebaseConfig.apiKey)){
  gate.hidden=false;btn.hidden=true;msg.textContent="Setup isn't finished: paste your Firebase settings into firebase-config.js (see SETUP.html).";
}else{
  const app=initializeApp(firebaseConfig);const auth=getAuth(app);
  const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  const mapErr=e=>({code:e&&e.code==="permission-denied"?"not_allowed":((e&&e.code)||"unknown"),message:e&&e.message});
  const wrap=s=>({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const adapter={
    doc:path=>{const r=doc(fs,path);return{
      set:d=>setDoc(r,d).catch(e=>{throw mapErr(e)}),
      delete:()=>deleteDoc(r).catch(e=>{throw mapErr(e)}),
      onSnapshot:(next,err)=>onSnapshot(r,s=>next(wrap(s)),e=>err&&err(mapErr(e)))}},
    collection:name=>({onSnapshot:(next,err)=>onSnapshot(collection(fs,name),s=>next({docs:s.docs.map(wrap),metadata:s.metadata}),e=>err&&err(mapErr(e)))})
  };
  let started=false;
  onAuthStateChanged(auth,u=>{
    if(u){gate.hidden=true;window.ppUser=u.email||"";if(!started){started=true;window.ppDbResolve(adapter)}}
    else{gate.hidden=false;btn.hidden=false}
  });
  btn.addEventListener("click",()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
    signInWithPopup(auth,p).catch(e=>{if(e&&/popup/.test(e.code||""))signInWithRedirect(auth,p);else msg.textContent="Sign-in didn't finish. Try again."})});
  window.ppSignOut=()=>signOut(auth).then(()=>location.reload());
  window.ppIdToken=()=>auth.currentUser?auth.currentUser.getIdToken():Promise.resolve("");
}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
<script>
(function(){
"use strict";
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MODES=["cook","quick","leftovers","skip"];
const MODE_LABEL={cook:"Cook",quick:"Quick",leftovers:"Leftovers",skip:"Off"};
const COURSES=["main","side","sauce","breakfast","dessert","snack","drink"];
const COURSE_LABEL={main:"Main dish",side:"Side",sauce:"Sauce / base",breakfast:"Breakfast",dessert:"Dessert",snack:"Snack",drink:"Drink"};
const RATINGS=["favorite","loved","liked","disliked"];
const RATING_LABEL={favorite:"★ Favorite",loved:"Loved",liked:"Liked",disliked:"Don't make again"};
const RATING_BONUS={favorite:3,loved:2,liked:0.5};
const DEFAULTS={budget:25,household:4,quickMax:25,defaultPrice:2,limits:[{what:"chicken",max:2}],
  days:{Mon:"cook",Tue:"quick",Wed:"cook",Thu:"leftovers",Fri:"cook",Sat:"cook",Sun:"cook"}};

const S={items:{},recipes:{},people:{},settings:null,plans:{},viewWeek:null,picking:null,review:null,loaded:{},db:null,canWrite:true,tab:"week",edit:null,confirm:null};
const $=s=>document.querySelector(s);
const view=$("#view");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+(Math.round(n*100)/100).toFixed(2);
const fmtQ=q=>{q=Math.round(q*100)/100;return Number.isInteger(q)?String(q):q.toFixed(2).replace(/0+$/,"").replace(/\.$/,"")};
const norm=s=>String(s||"").trim().toLowerCase();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80)||("x"+Date.now());
const list=s=>String(s||"").split(",").map(norm).filter(Boolean);

function settings(){const s=Object.assign({},DEFAULTS,S.settings||{});s.days=Object.assign({},DEFAULTS.days,(S.settings||{}).days||{});s.limits=Array.isArray(s.limits)?s.limits:[];return s}
function setSync(t,warn){const el=$("#sync");el.textContent=t;el.classList.toggle("warn",!!warn)}

/* ---------- writes: one at a time per doc, debounced ---------- */
const queues={},timers={};
function write(path,fn){
  if(!S.db){setSync("Not connected: changes can't be saved",true);return Promise.resolve()}
  const p=(queues[path]||Promise.resolve()).then(()=>fn(S.db.doc(path))).catch(e=>{
    if(e&&e.code==="invalid_argument"&&!S.canWriteChecked){S.canWrite=false;render()}
    setSync(e&&e.code==="quota_exceeded"?"Storage is full":"Couldn't save. Try again",true);
  });
  queues[path]=p;return p;
}
function later(path,data,ms){clearTimeout(timers[path]);timers[path]=setTimeout(()=>write(path,d=>d.set(data)),ms||600)}

/* ---------- people, weeks and who's eating ---------- */
const isoDay=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function weekStartFor(when){const m=new Date(when);m.setHours(0,0,0,0);const dow=(m.getDay()+6)%7;m.setDate(m.getDate()+(dow>=5?7-dow:-dow));return m}
function addDays(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return isoDay(d)}
function dateOf(p,day){const s=p&&p.weekStart?new Date(p.weekStart+"T00:00:00"):weekStartFor(p&&p.made?p.made:new Date());s.setDate(s.getDate()+DAYS.indexOf(day));return s}
function dateIn(ws,day){const s=new Date(ws+"T00:00:00");s.setDate(s.getDate()+DAYS.indexOf(day));return s}
function todayStart(){const t=new Date();t.setHours(0,0,0,0);return t}
function peopleList(){return Object.entries(S.people).map(([id,p])=>Object.assign({id},p)).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")))}
function householdSize(){return Object.keys(S.people).length||settings().household}
function eatersFor(p,day){const all=peopleList();const w=p&&p.who&&p.who[day];return Array.isArray(w)?all.filter(x=>w.includes(x.id)):all}
function countFor(p,day){return Object.keys(S.people).length?eatersFor(p,day).length:settings().household}
function modeFor(p,day){return (p&&p.modes&&p.modes[day])||settings().days[day]||"cook"}
function viewPlan(){return S.plans[S.viewWeek]||null}
function hasDays(p){return !!(p&&Array.isArray(p.days)&&p.days.length)}
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function updatePlan(ws,fn,ms){const p=clone(S.plans[ws]||{weekStart:ws});p.weekStart=ws;fn(p);S.plans[ws]=p;render();if(ms)later("plans/"+ws,p,ms);else write("plans/"+ws,d=>d.set(p));return p}

/* ---------- planner ---------- */
function words(r){const w=new Set((r.tags||[]).map(norm));Object.keys(r.ingredients||{}).forEach(k=>w.add(norm(k)));w.add(norm(r.name));return w}
function hits(ws,term){term=norm(term);if(!term)return false;for(const w of ws){if(w===term||w.includes(term))return true}return false}
/* hard = allergies (anyone) or an adult's won't-eat; kid = a kid's won't-eat, which a weekly "pass" can overrule */
function blockInfo(r,people){const ws=words(r);const hard=[],kid=[],allergy=[];
  for(const p of people){const nm=p.name||"someone";
    if((p.allergies||[]).some(n=>hits(ws,n))){allergy.push(nm);hard.push(nm);continue}
    if((p.nogo||[]).some(n=>hits(ws,n))){(p.kid?kid:hard).push(nm)}}
  return {hard,kid,allergy}}
function blockedBy(r,people){const b=blockInfo(r,people);return b.hard.length?b.hard[0]:null}
function kidPasses(){const v=settings().kidPasses;return v===undefined||v===""?1:Math.max(0,Number(v)||0)}
function pantryMap(){const m={};for(const it of Object.values(S.items)){m[norm(it.name)]=Number(it.have)||0}return m}
function priceOf(name){const it=S.items[slug(name)];const st=settings();return it&&it.price!=null&&it.price!==""?Number(it.price):st.defaultPrice}
function scaled(r,eaters){const n=Math.max(1,eaters);const serves=Number(r.serves)||householdSize();const f=n/serves;const need={};for(const [k,q] of Object.entries(r.ingredients||{})){need[norm(k)]=Math.round((Number(q)||1)*f*100)/100}return need}
/* what other weeks' still-to-cook meals will use up (and what their unbought lists will add) */
/* ---------- new recipe night: one cook night a week left open for something new ---------- */
function ideasPerWeek(){const v=settings().newPerWeek;return v===undefined||v===""?1:Math.max(0,Math.min(3,Number(v)||0))}
function chooseIdeaDays(wk,p,locked,keep){const n=ideasPerWeek();if(!n)return[];
  const already=Object.values(keep).filter(x=>x&&x.idea).length;const want=n-already;if(want<=0)return[];
  const prevIdea=(p&&p.days||[]).filter(x=>x.idea&&!keep[x.day]&&!locked[x.day]&&modeFor(p,x.day)==="cook"&&countFor(p,x.day)>0).map(x=>x.day);
  const order=["Sat","Sun","Fri","Wed","Mon","Thu","Tue"];const out=prevIdea.slice(0,want);
  for(const d of order){if(out.length>=want)break;if(out.includes(d)||locked[d]||keep[d])continue;if(modeFor(p,d)!=="cook"||countFor(p,d)===0)continue;
    const nd=DAYS[DAYS.indexOf(d)+1];if(nd&&modeFor(p,nd)==="leftovers")continue;out.push(d)}
  return out}
const CUISINES=["mexican","italian","asian","thai","indian","chinese","greek","mediterranean","cajun","bbq","korean","japanese","french","american","southern"];
/* ---------- mood for the week + seasonal nudge ---------- */
const MOODS=[["Soups & stews",["soup","stew","chili","bisque","chowder"]],["Comfort food",["comfort","casserole","meatloaf","pot pie","mac and cheese","baked","mashed"]],["Grill",["grill","grilled","bbq","burger","kabob"]],["Light & fresh",["salad","bowl","light","lettuce","wrap","poke"]],["Seafood",["shrimp","salmon","fish","tuna","clam","mussel","lobster","crab"]],["Mexican",["mexican","taco","enchilada","burrito","quesadilla","fajita"]],["Italian",["italian","pasta","pizza","tortellini","lasagna","focaccia"]],["Asian",["asian","thai","chinese","pad thai","curry","korean","japanese","stir-fry","banh mi"]],["Chicken",["chicken"]],["Beef",["beef","steak"]],["Meatless",["vegetarian"]],["Slow cooker",["slow cooker","instant pot","crockpot"]]];
const SEASON_TERMS={fall:["soup","stew","chili","bisque","chowder","roast","casserole","pumpkin","squash","apple"],winter:["soup","stew","chili","bisque","roast","casserole","comfort","pot pie"],spring:["salad","light","bowl","asparagus","lemon","grill"],summer:["grill","grilled","salad","bbq","corn","tomato","cold","poke"]};
function seasonNow(){const m=new Date().getMonth();return m>=8&&m<=10?"fall":m===11||m<=1?"winter":m<=4?"spring":"summer"}
function moodTerms(p){const out=[];((p&&p.mood)||[]).forEach(lab=>{const m=MOODS.find(x=>x[0]===lab);if(m)out.push(...m[1])});list((p&&p.moodText)||"").forEach(t=>out.push(t));return out}
function moodScore(ws,p){let s=0;const terms=moodTerms(p);if(terms.length&&terms.some(t=>hits(ws,t)))s+=3;
  if(settings().seasonal!==false&&SEASON_TERMS[seasonNow()].some(t=>hits(ws,t)))s+=1.5;return s}
function ideaQuery(p,d,seed){
  const eaters=Object.keys(S.people).length?eatersFor(p,d):[];
  const MEAT=/chicken|beef|turkey|pork|sausage|bacon|steak|lamb|ham|salmon|shrimp|fish|tilapia|cod|tuna|meatball|tofu|chops?|roast|ribs?/;

function newIdea(ws,day){updatePlan(ws,p=>{const x=(p.days||[]).find(y=>y.day===day);if(x)x.query=ideaQuery(p,day,Math.random())})}

/* "What did we actually have?" row on every planned night */

function renderMadePicker(ws,d){
  const list=Object.entries(S.recipes).sort((a,b)=>norm(a[1].name).localeCompare(norm(b[1].name)));
  return `<div class="card" style="margin-top:10px;background:var(--bg)"><div class="row spread"><b>What did you make on ${d}?</b><button class="ghost" id="pickcancel" style="min-height:32px;padding:4px 10px">Close</button></div>

async function madeOther(ws,day,rid){
  const r=S.recipes[rid];if(!r)return;const p=S.plans[ws];S.picking=null;S.pickMode=null;
  const need=scaled(r,countFor(p,day));
  updatePlan(ws,q=>{const x=q.days.find(y=>y.day===day);if(!x)return;Object.assign(x,{rid,name:r.name,need,missing:{},cost:0,madeOther:true,idea:false,notMade:false,cooked:false});if(x.mode==="leftovers")x.mode="cook"});
  await cooked(ws,day);

async function undoMade(ws,day){
  const p=S.plans[ws];const x=p&&(p.days||[]).find(y=>y.day===day);if(!x)return;
  if(x.cooked)for(const [k,q] of Object.entries(x.need||{})){const id=slug(k);const it=S.items[id];if(!it)continue;const next=Object.assign({},it,{have:Math.round(((Number(it.have)||0)+q)*100)/100});S.items[id]=next;await write("items/"+id,d=>d.set(next))}

    <div class="row small muted" style="gap:6px">$<input class="price num" id="price-${esc(id)}" data-price="${esc(id)}" type="number" step="0.05" min="0" inputmode="decimal" value="${it.price===""||it.price==null?"":esc(it.price)}" placeholder="${settings().defaultPrice}" aria-label="Price for ${esc(it.name)}"> per ${esc(u==="each"?"one":u)}</div></div>

/* ---------- units: how an item is counted (1-lb pack, pack, can, dozen…) ---------- */
const UNITS=["each","1-lb pack","2-lb pack","pack","family pack","lb","can","jar","bottle","bag","box","dozen","loaf","bunch","head","portion"];
function guessUnit(name){const n=norm(name);
  if(/ground (beef|turkey|pork|chicken)|sausage|bacon|hot dogs?|stew meat|ground/.test(n))return "1-lb pack";
  if(/chicken|tenders?|thighs?|drumsticks?|wings?|pork chops?|chops?|steaks?|roast|ribs?|salmon|fish|shrimp|tilapia|cutlets?/.test(n))return "pack";
  if(/^eggs?$/.test(n))return "dozen";
  if(/canned|beans|tomato sauce|soup|broth|coconut milk|tuna|corn$/.test(n))return "can";
  if(/rice|pasta|spaghetti|noodles|lentils|flour|sugar|chips|frozen/.test(n))return "bag";
  if(/bread|buns?|rolls?$/.test(n))return "loaf";
  if(/sauce|ketchup|mustard|mayo|dressing|oil|salsa|curry paste|peanut butter|jam/.test(n))return "jar";
  if(/cheese|tortillas|cereal|crackers/.test(n))return "pack";
  return "each"}
function unitOf(name){const it=S.items[slug(name)];return (it&&it.unit)||guessUnit(name)}
function plural(u,q){if(!u||u==="each")return "";if(Math.abs(q-1)<1e-9)return u;if(/(s|lb|dozen)$/.test(u))return u;if(/(x|ch|sh)$/.test(u))return u+"es";return u.replace(/^(.*?)(pack)$/,"$1packs").replace(/^(.*[^s])$/,"$1s")}
function qtyLabel(q,name){const u=plural(unitOf(name),q);return fmtQ(q)+" × "+name+(u?" ("+u+")":"")}
const UNIT_RE=/^(\d+(?:\.\d+)?\s*-?\s*(?:lb|oz)\.?\s+(?:packs?|packages?|pkgs?)|family packs?|packs?|packages?|pkgs?|lbs?\.?|pounds?|cans?|jars?|bottles?|bags?|boxes|box|dozen|loaf|loaves|bunch(?:es)?|heads?|each|portions?)\b\s*(?:of\s+)?/i;

/* ---------- Claude: photo or name -> recipe draft ---------- */
const AI_ERR={not_granted:"Claude isn't allowed on this page. Type the recipe in instead.",sampling_disabled:"Claude isn't available on this account.",rate_limited:"Claude is busy or you've hit a usage limit. Try again in a bit.",session_expired:"Sign in to claude.ai again, then retry.",image_rejected:"That photo couldn't be read. Try a clearer or smaller picture.",refused:"Claude couldn't do that one. Try a different photo or name.",invalid_json:"Claude's answer came back garbled. Tap again to retry."};
function aiPrompt(kind,name){
  const st=settings();const have=Object.values(S.items).map(i=>i.name).slice(0,150).join(", ");
  const task=kind==="photo"
    ?"The attached image(s) show a recipe (a card, a cookbook page or a screenshot). Read it and turn it into the JSON below. If it isn't a recipe, return {\"error\":\"not a recipe\"}."
    :`Write a simple, typical weeknight family version of: "${name}". Keep it to common grocery-store ingredients.`;
  return task+`

Rules:
- Count ingredients the way a US grocery store sells them, so a pantry count can match. Give each a "unit": ground meat in "1-lb pack", chicken breasts/tenders/thighs and other meat by the "pack", eggs by the "dozen", canned goods by the "can", rice/pasta by the "bag", produce "each" (1 onion). qty is how many of that unit the recipe uses (it may be 0.5). Leave out salt, pepper, oil and water.

- Item names: lowercase, singular-ish, no brand names.
- serves: the recipe's own yield (the household eats ${st.household}).

- tags: 2-5 lowercase words from cuisine, main protein, and "quick" if 25 minutes or less, "vegetarian" if no meat or fish.

Reply with only this JSON:
{"name":"Chicken Tacos","minutes":20,"serves":4,"tags":["mexican","chicken","quick"],"ingredients":[{"item":"chicken breast","qty":1,"unit":"pack","price_each":9},{"item":"tortillas","qty":1,"unit":"pack","price_each":3},{"item":"onion","qty":1,"unit":"each","price_each":0.8}],"how":"Cook sliced chicken with chili spices; serve in warm tortillas."}`;
}
async function aiDraft(kind,payload){
  if(!S.sample||(S.ai&&S.ai.busy))return;
  const ctl=new AbortController();
  S.ai={busy:true,msg:kind==="photo"?"Reading the photo… (this can take up to a minute)":"Filling in "+payload+"…",ctl};render();
  try{
    const opt={signal:ctl.signal};if(kind==="photo")opt.images=payload;
    const j=await S.sample.json(aiPrompt(kind,kind==="name"?payload:""),opt);
    if(!j||typeof j!=="object"||j.error||!j.name)throw{code:"refused"};
    const ing={},prices={},units={};
    (Array.isArray(j.ingredients)?j.ingredients:[]).forEach(x=>{const n=norm(x&&x.item);if(!n)return;ing[n]=(ing[n]||0)+(Number(x.qty)>0?Number(x.qty):1);if(Number(x.price_each)>0)prices[n]=Math.round(Number(x.price_each)*100)/100;if(x.unit)units[n]=normUnit(String(x.unit))});

/* ---------- optional: Claude through your own Cloudflare Worker ---------- */
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.85).split(",")[1])};
  img.onerror=()=>{URL.revokeObjectURL(url);rej({code:"image_rejected"})};img.src=url})}
function aiClient(endpoint){return{json:async(prompt,opt)=>{
  opt=opt||{};const images=[];for(const f of (opt.images||[]))images.push(await shrink(f));
  const token=window.ppIdToken?await window.ppIdToken():"";
  let r;try{r=await fetch(endpoint,{method:"POST",signal:opt.signal,headers:{"content-type":"application/json","authorization":"Bearer "+token},body:JSON.stringify({prompt,images})})}
  catch(e){throw {code:e&&e.name==="AbortError"?"cancelled":"upstream_error"}}
  if(r.status===403)throw {code:"not_granted"};if(r.status===429)throw {code:"rate_limited"};if(!r.ok)throw {code:"upstream_error"};
  const j=await r.json();const t=String(j.text||"");const a=t.indexOf("{"),b=t.lastIndexOf("}");
  try{return JSON.parse(t.slice(a,b+1))}catch(_){throw {code:"invalid_json"}}
}}}

    (Array.isArray(x.ingredients)?x.ingredients:[]).forEach(i=>{if(typeof i==="string"){const P=parseIng(i);Object.assign(ing,P.ing);Object.assign(units,P.units);return}
      const n=norm(i&&i.item);if(!n)return;if(i.staple){if(!staples.includes(n))staples.push(n);return}
      const q=Number(i.shop_qty)>0?Number(i.shop_qty):(Number(i.qty)>0?Number(i.qty):1);const u=i.shop_unit||i.unit;
      ing[n]=Math.round(((ing[n]||0)+q)*100)/100;if(u)units[n]=normUnit(String(u));if(Number(i.price_each)>0)prices[n]=Math.round(Number(i.price_each)*100)/100});
    const r={name:String(x.name).trim().slice(0,80),course:COURSES.includes(x.course)?x.course:"main",minutes:Number(x.minutes)||"",serves:Number(x.serves)||householdSize(),tags:(Array.isArray(x.tags)?x.tags:list(x.tags)).map(norm).filter(Boolean).slice(0,8),ingredients:ing,staples,how:String(x.how||"").trim().slice(0,1500)};
    if(x.source)r.source=String(x.source).slice(0,120);if(x.note)r.note=String(x.note).slice(0,300);
    if(RATINGS.includes(x.rating))r.rating=x.rating;if(x.comment)r.comment=String(x.comment).slice(0,500);if(/^\d{4}-\d\d-\d\d$/.test(x.restUntil||""))r.restUntil=x.restUntil;

  <p class="small muted" style="margin:0">From <b>${esc(I.file)}</b>. Untick any you don't want. Ones you already have are unticked; tick them to replace yours. Tap a name to see the ingredients.</p></div>
  <div class="card"><div class="list">${I.rows.map((x,i)=>`<div class="li" style="align-items:start"><label style="flex-direction:row;align-items:start;gap:10px;color:var(--ink);font-size:.95rem;font-weight:400;min-width:0"><input type="checkbox" data-impon="${i}" ${x.on?"checked":""} style="width:20px;min-height:20px;margin-top:3px;accent-color:var(--accent)">
    <details style="min-width:0"><summary style="cursor:pointer"><b>${esc(x.r.name)}</b> ${x.exists?`<span class="small" style="color:var(--butter)">· already in your book</span>`:""}<br><span class="small muted">${x.r.course!=="main"?esc(COURSE_LABEL[x.r.course])+" · ":""}${x.r.minutes?esc(x.r.minutes)+" min · ":""}serves ${esc(x.r.serves)} · ${Object.keys(x.r.ingredients).length} ingredients${x.r.tags.length?" · "+esc(x.r.tags.join(", ")):""}</span></summary>
    <div class="small" style="margin-top:6px;white-space:pre-line">${esc(ingText({ingredients:x.r.ingredients,units:x.units}))}</div>${x.r.staples&&x.r.staples.length?`<div class="small muted">Staples: ${esc(x.r.staples.join(", "))}</div>`:""}${x.r.how?`<p class="how">${esc(x.r.how)}</p>`:""}${x.r.note?`<p class="small" style="color:var(--butter);margin:4px 0 0">${esc(x.r.note)}</p>`:""}</details></label></div>`).join("")}</div></div>
  <div class="row"><button class="primary" id="impok" ${n&&S.canWrite?"":"disabled"}>Import ${n} recipe${n===1?"":"s"}</button><button class="ghost" id="impcancel">Cancel</button></div>`}
async function doImport(){const I=S.imp;if(!I)return;const rows=I.rows.filter(x=>x.on);S.imp=null;render();
  for(const x of rows){S.recipes[x.id]=x.r;await write("recipes/"+x.id,d=>d.set(x.r));
    for(const k of Object.keys(x.r.ingredients)){const iid=slug(k);const old=S.items[iid];
      if(old){if(x.units[k]&&!old.unit){const it=Object.assign({},old,{unit:x.units[k]});S.items[iid]=it;await write("items/"+iid,d=>d.set(it))}continue}
      const it={name:k,have:0,unit:x.units[k]||guessUnit(k),price:x.prices[k]!=null?x.prices[k]:""};S.items[iid]=it;await write("items/"+iid,d=>d.set(it))}}
  setSync("Imported "+rows.length+" recipe"+(rows.length===1?"":"s"));render()}

/* ---------- first run: load the starter recipes and pantry ---------- */
async function loadStarter(){
  const seed=window.PP_SEED;if(!seed||!S.db)return;S.seeding=true;render();
  for(const [coll,docs] of Object.entries(seed)){for(const [id,data] of Object.entries(docs)){await write(coll+"/"+id,d=>d.set(data))}}
  S.seeding=false;render();
}

/* ---------- events ---------- */
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;S.tab=b.dataset.tab;S.edit=null;S.confirm=null;render();window.scrollTo(0,0)});
function saveSettings(patch){const st=Object.assign(settings(),patch);S.settings=st;later("settings/main",st,700)}
view.addEventListener("click",e=>{
  const t=e.target.closest("button,input[type=checkbox]");if(!t)return;const ds=t.dataset;
  if(t.id==="make")return makeWeek();
  if(t.id==="starter")return loadStarter();
  if(ds.notmade)return notMade(ds.ws||S.viewWeek,ds.notmade);
  if(ds.cook)return cooked(ds.ws||S.viewWeek,ds.cook);
  if(ds.wk){S.viewWeek=addDays(S.viewWeek,Number(ds.wk));S.picking=null;return render()}
  if(t.id==="ics")return icsWeek(S.viewWeek);
  if(ds.swap){S.picking=null;return swapDay(S.viewWeek,ds.swap)}
  if(ds.pick){S.picking=S.picking===ds.pick&&S.pickMode!=="made"?null:ds.pick;S.pickMode=null;return render()}
  if(ds.madeother){S.picking=S.picking===ds.madeother&&S.pickMode==="made"?null:ds.madeother;S.pickMode="made";return render()}
  if(ds.madeid)return madeOther(S.viewWeek,S.picking,ds.madeid);
  if(ds.madenone){const d=ds.madenone;S.picking=null;S.pickMode=null;return updatePlan(S.viewWeek,p=>{const x=p.days.find(y=>y.day===d);if(x){x.notMade=true;x.notMadeWhy="Made something not in our book"}})}
  if(ds.ateleft){const d=ds.ateleft;return updatePlan(S.viewWeek,p=>{const x=p.days.find(y=>y.day===d);if(x)x.cooked=true})}
  if(ds.unmade)return undoMade(S.viewWeek,ds.unmade);
  if(ds.pickid)return pickMeal(S.viewWeek,S.picking,ds.pickid);
  if(t.id==="pickcancel"){S.picking=null;return render()}
  if(ds.lock)return toggleLock(S.viewWeek,ds.lock);
  if(ds.who){const [d,pid]=ds.who.split("|");return toggleWho(S.viewWeek,d,pid)}
  if(ds.mode)return cycleMode(S.viewWeek,ds.mode);
  if(ds.got!=null&&t.type==="checkbox")return toggleGot(S.viewWeek,ds.got);
  if(ds.review)return startReview(ds.review);
  if(ds.ron!=null&&t.type==="checkbox"){S.review.rows[Number(ds.ron)].on=t.checked;return render()}
  if(ds.xdel!=null){S.review.extra.splice(Number(ds.xdel),1);return render()}
  if(t.id==="rvok")return confirmReview();
  if(ds.mood){const lab=ds.mood;return updatePlan(S.viewWeek,p=>{const m=(p.mood||[]).slice();const i=m.indexOf(lab);if(i>=0)m.splice(i,1);else m.push(lab);p.mood=m},600)}
  if(t.id==="st-seasonal"){saveSettings({seasonal:t.checked});return render()}
  if(ds.rate){const [rid,k]=ds.rate.split("|");const r0=S.recipes[rid];if(!r0)return;const r=Object.assign({},r0,{rating:r0.rating===k?"":k});S.recipes[rid]=r;render();write("recipes/"+rid,d=>d.set(r));return}
  if(ds.ideaadd){S.edit={forDay:{ws:S.viewWeek,day:ds.ideaadd},draft:{name:"",tags:[],ingredients:{},units:{},how:""}};S.tab="recipes";S.picking=null;render();window.scrollTo(0,0);return}
  if(ds.kid&&t.type==="checkbox"){const id=ds.kid;const pp=Object.assign({},S.people[id],{kid:t.checked});S.people[id]=pp;render();write("people/"+id,d=>d.set(pp));return}
  if(ds.impon!=null&&t.type==="checkbox"&&S.imp){S.imp.rows[Number(ds.impon)].on=t.checked;return render()}
  if(t.id==="impok")return doImport();
  if(t.id==="impcancel"){S.imp=null;return render()}
  if(t.id==="rvcancel"){S.review=null;return render()}
  if(t.id==="pcheck"){S.pcheck=true;S.pantryAll=true;return render()}
  if(t.id==="pdone"){S.pcheck=false;S.confirm=null;saveSettings({pantryChecked:isoDay(new Date())});return render()}
  if(ds.idel){S.confirm="item:"+ds.idel;return render()}
  if(ds.idel2){const id=ds.idel2;delete S.items[id];S.confirm=null;render();write("items/"+id,d=>d.delete());return}
  if(t.id==="zero"){S.confirm="zero";return render()}
  if(t.id==="wipe"){S.confirm="wipe";return render()}
  if(t.id==="cancelc"){S.confirm=null;return render()}
  if(t.id==="zero2")return pantryAll(it=>Object.assign({},it,{have:0}));
  if(t.id==="wipe2")return pantryAll(()=>null);
  if(t.id==="signout"){if(window.ppSignOut)window.ppSignOut();return}
  if(t.id==="pantryAll"){S.pantryAll=!S.pantryAll;return render()}
  if(ds.inc||ds.dec){const id=ds.inc||ds.dec;const it=Object.assign({},S.items[id]);it.have=Math.max(0,Math.round(((Number(it.have)||0)+(ds.inc?1:-1))*100)/100);S.items[id]=it;render();later("items/"+id,it,700);return}
  if(t.id==="newRec"){S.edit={};S.ai=null;return render()}
  if(t.id==="aiName"){const v=($("#aiNameIn")||{}).value;if(v&&v.trim())aiDraft("name",v.trim().slice(0,80));return}
  if(t.id==="aiStop"){if(S.ai&&S.ai.ctl)S.ai.ctl.abort();return}
  if(ds.edit){S.edit={id:ds.edit};S.confirm=null;render();window.scrollTo(0,0);return}
  if(t.id==="rf-cancel"){S.edit=null;S.confirm=null;return render()}
  if(t.id==="rf-del"){S.confirm="rec:"+S.edit.id;return render()}
  if(t.id==="rf-del2"){const id=S.edit.id;delete S.recipes[id];S.edit=null;S.confirm=null;render();write("recipes/"+id,d=>d.delete());return}
  if(t.id==="addPerson"){const id="p"+Date.now().toString(36);const p={name:"",likes:[],nogo:[]};S.people[id]=p;render();write("people/"+id,d=>d.set(p));return}
  if(ds.pdel){S.confirm="ppl:"+ds.pdel;return render()}
  if(ds.pcancel){S.confirm=null;return render()}
  if(ds.pdel2){const id=ds.pdel2;delete S.people[id];S.confirm=null;render();write("people/"+id,d=>d.delete());return}
  if(t.id==="addLimit"){const st=settings();st.limits=st.limits.concat([{what:"",max:2}]);S.settings=st;render();later("settings/main",st);return}
  if(ds.ldel!=null){const st=settings();st.limits=st.limits.filter((_,i)=>i!==Number(ds.ldel));S.settings=st;render();later("settings/main",st);return}
});
view.addEventListener("input",e=>{
  const t=e.target,ds=t.dataset;
  if(ds.unit){const id=ds.unit;const it=Object.assign({},S.items[id],{unit:normUnit(t.value)});S.items[id]=it;later("items/"+id,it,1200);return}
  if(ds.have){const id=ds.have;if(t.value==="")return;const it=Object.assign({},S.items[id],{have:Math.max(0,Number(t.value)||0)});S.items[id]=it;later("items/"+id,it,900);return}
  if(ds.price){const id=ds.price;const it=Object.assign({},S.items[id],{price:t.value===""?"":Number(t.value)});S.items[id]=it;later("items/"+id,it,900);return}
  if(ds.rq!=null&&S.review){S.review.rows[Number(ds.rq)].q=Math.max(0,Number(t.value)||0);return}
  if(t.id==="st-dinner"&&t.value){saveSettings({dinnerTime:t.value});return}
  if(ds.moodtext){const v=t.value;const ws=S.viewWeek;const p=clone(S.plans[ws]||{weekStart:ws});p.weekStart=ws;p.moodText=v;S.plans[ws]=p;later("plans/"+ws,p,900);return}
  if(ds.pf){const id=ds.pf;const p=Object.assign({},S.people[id]);p[ds.k]=(ds.k==="name"||ds.k==="notes")?t.value:list(t.value);S.people[id]=p;later("people/"+id,p,900);return}
  if(ds.lw!=null||ds.lm!=null){const st=settings();const i=Number(ds.lw!=null?ds.lw:ds.lm);st.limits=st.limits.map((l,j)=>j===i?(ds.lw!=null?{what:norm(t.value),max:l.max}:{what:l.what,max:Number(t.value)||0}):l);S.settings=st;later("settings/main",st,900);return}
  const map={"st-budget":"budget","st-household":"household","st-quick":"quickMax","st-dp":"defaultPrice","st-kidpass":"kidPasses","st-newpw":"newPerWeek"};
  if(map[t.id]&&t.value!==""){saveSettings({[map[t.id]]:Number(t.value)})}
});
view.addEventListener("keydown",e=>{if(e.target.id==="aiNameIn"&&e.key==="Enter"){e.preventDefault();const v=e.target.value.trim();if(v)aiDraft("name",v.slice(0,80))}});
view.addEventListener("change",e=>{const t=e.target;
  if(t.id==="impFile"&&t.files&&t.files[0]){const f=t.files[0];f.text().then(txt=>{try{S.imp={file:f.name,rows:readImport(txt)};S.ai=null}catch(err){S.ai={err:err.message}}render();window.scrollTo(0,0)});return}
  if(t.id==="aiPhoto"&&t.files&&t.files.length){const files=Array.from(t.files).slice(0,S.maxImages||4);aiDraft("photo",files);return}
  if(t.dataset.dm){const st=settings();st.days[t.dataset.dm]=t.value;S.settings=st;later("settings/main",st,300)}});
view.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="xadd"&&S.review){const k=norm($("#xa-name").value);if(!k)return;S.review.extra.push({k,q:Math.max(0,Number($("#xa-q").value)||1),u:normUnit($("#xa-u").value||"")||(S.items[slug(k)]&&S.items[slug(k)].unit)||guessUnit(k)});render();const n=$("#xa-name");if(n)n.focus();return}
  if(f.id==="addItem"){const name=norm($("#ni-name").value);if(!name)return;const id=slug(name);const old=S.items[id];const pv=$("#ni-price").value;const uv=normUnit($("#ni-unit").value||"");
    const it={name,unit:uv||(old&&old.unit)||guessUnit(name),have:Math.round(((old?Number(old.have)||0:0)+(Number($("#ni-have").value)||0))*100)/100,price:pv===""?(old?old.price:""):Number(pv)};
    S.items[id]=it;render();write("items/"+id,d=>d.set(it));const n=$("#ni-name");if(n)n.focus();return}
  if(f.id==="recForm"){const name=$("#rf-name").value.trim();if(!name)return;const id=S.edit.id||slug(name);
    const P=parseIng($("#rf-ing").value);
    const old=S.edit.id?S.recipes[S.edit.id]||{}:{};
    const rr=(document.querySelector('input[name="rf-rating"]:checked')||{}).value||"";const rest=$("#rf-rest").value;
    const r=Object.assign({},old,{name,course:$("#rf-course").value||"main",minutes:Number($("#rf-min").value)||"",serves:Number($("#rf-serves").value)||settings().household,tags:list($("#rf-tags").value),staples:list($("#rf-staples").value),ingredients:P.ing,how:$("#rf-how").value.trim(),rating:rr,comment:$("#rf-comment").value.trim()});
    if(rest==="")delete r.restUntil;else if(rest!=="keep")r.restUntil=addDays(isoDay(todayStart()),7*Number(rest));
    if(S.edit.forDay)r.source=r.source||"website";
    const forDay=S.edit.forDay;
    const prices=(S.edit.draft&&S.edit.draft.prices)||{};
    S.recipes[id]=r;S.edit=null;render();write("recipes/"+id,d=>d.set(r));
    Object.keys(r.ingredients).forEach(k=>{const iid=slug(k);const old=S.items[iid];
      if(old){if(P.units[k]&&!old.unit){const it=Object.assign({},old,{unit:P.units[k]});S.items[iid]=it;write("items/"+iid,d=>d.set(it))}return}
      const it={name:k,have:0,unit:P.units[k]||guessUnit(k),price:prices[k]!=null?prices[k]:""};S.items[iid]=it;write("items/"+iid,d=>d.set(it))});
    if(forDay){S.tab="week";S.viewWeek=forDay.ws;pickMeal(forDay.ws,forDay.day,id);window.scrollTo(0,0)}
    return}
});

/* ---------- connect ---------- */
render();
(async function connect(){
  setSync("Signing in…");
  const db=await window.ppDb;
  S.db=db;setSync("Connecting…");
  if(window.ppAiUrl){S.sample=aiClient(window.ppAiUrl);S.canPhoto=true;S.maxImages=4}
  const timer=setTimeout(()=>{if(Object.keys(S.loaded).length<5)setSync("Offline: showing the saved copy",true)},10000);
  const done=(k,snap)=>{if(!snap.metadata.fromCache)S.loaded[k]=true;if(Object.keys(S.loaded).length>=5){clearTimeout(timer);setSync(S.canWrite?"Synced":"View only")}};
  const fail=e=>{clearTimeout(timer);
    if(e&&e.code==="not_allowed"){S.canWrite=false;setSync("This Google account isn't on the household list",true);render();return}
    setSync("Sync error: "+((e&&e.code)||"unknown"),true)};
  const coll=(name,key)=>db.collection(name).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());
    const pend=Object.keys(timers).some(p=>p.startsWith(name+"/"));
    if(!pend||!snap.metadata.hasPendingWrites)S[key]=m;
    done(name,snap);if(!(S.tab==="family"||S.tab==="rules"||S.edit||S.pcheck||S.review)||!document.activeElement||document.activeElement===document.body)render()},fail);
  coll("items","items");coll("recipes","recipes");coll("people","people");
  db.doc("settings/main").onSnapshot(snap=>{if(snap.exists)S.settings=snap.data();done("settings",snap);if(S.tab!=="rules")render()},fail);
  db.collection("plans").onSnapshot(snap=>{const m={};let legacy=null;
    snap.docs.forEach(d=>{const v=d.data();if(d.id==="current")legacy=v;else m[d.id]=v});
    if(legacy){const ws=legacy.weekStart||isoDay(weekStartFor(legacy.made||new Date()));if(!m[ws])m[ws]=Object.assign({},legacy,{weekStart:ws})}
    const pend=Object.keys(timers).some(p=>p.startsWith("plans/"));if(!pend||!snap.metadata.hasPendingWrites)S.plans=m;
    done("plans",snap);if(S.tab==="week"&&!S.review)render()},fail);
})();
})();
</script>
